name: Contrôles

on:
  pull_request:
  push:
    branches: [main]

# Dépôt public : ses contrôles tournent sur les runners de GitHub, pas sur les Mac de ssk-it. Un runner auto-hébergé exécuterait le code de n'importe quelle demande de fusion ouverte depuis une fourche, sur une machine de l'organisation.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site:
    name: Site (types, lint, format, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Lit la version dans `packageManager`.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Aucune dépendance livrée (`dependencies`) ne porte de faille connue de sévérité high ou critical. Le lockfile fait foi : rien n'est installé pour le savoir, d'où ce pas avant l'installation. Une faille sans correctif se déclare dans `audit.ignore` de pnpm-workspace.yaml, par son GHSA, motivée et datée (docs/pratiques.md). Les dépendances de développement ne bloquent pas : les alertes Dependabot du dépôt les suivent.
      - name: Audit des dépendances livrées
        run: pnpm audit --prod --audit-level high

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm typecheck

      # Pas de --fix : la CI constate, elle ne corrige pas.
      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      # Les tests `*.navigateur.test.ts` tournent dans WebKit, sans tête.
      - name: Installer WebKit
        run: pnpm exec playwright install --with-deps webkit

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm exec vite build
