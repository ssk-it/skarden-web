name: Contrôles

on:
  pull_request:
  push:
    branches: [main]

# Dépôt public : ses contrôles tournent sur les runners de GitHub, pas sur les Mac de ssk-it. Un runner auto-hébergé exécuterait le code de n'importe quelle demande de fusion ouverte depuis une fourche, sur une machine de l'organisation.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site:
    name: Site (types, lint, format, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Lit la version dans `packageManager`.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm typecheck

      # Pas de --fix : la CI constate, elle ne corrige pas.
      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm exec vite build
