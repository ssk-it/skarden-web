version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # `typescript-eslint` borne `typescript` (peerDependencies `>=4.8.4 <6.1.0`, vérifié en 8.72.0) ; pnpm n'en fait qu'un avertissement. Défaire le groupe quand la borne disparaît.
      typescript:
        patterns: ["typescript", "typescript-eslint", "vue-tsc"]
      mineures:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 n'a plus l'API JavaScript dont dépendent `vue-tsc` 3.3 et `typescript-eslint` 8.71 (constaté dans ssk-it/skift#6). Rouvrir quand l'un et l'autre le prennent en charge.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      # Toutes les actions dans une seule demande de fusion : chacune modifie `controles.yml`, et des demandes séparées entrent en conflit dès que la première est fusionnée.
      actions:
        patterns: ["*"]
